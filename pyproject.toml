[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riptrack-redump"
version = "0.1.0"
description = "Extract contiguous CD tracks with redumper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
]

[project.urls]
Homepage = "https://github.com/john-stephens/riptrack-redump"
Repository = "https://github.com/john-stephens/riptrack-redump"
Issues = "https://github.com/john-stephens/riptrack-redump/issues"

[project.optional-dependencies]
accuraterip = ["ARver>=1.5,<2"]

[project.scripts]
riptrack-redump = "riptrack_redump.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
