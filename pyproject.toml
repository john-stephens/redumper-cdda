[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redumper-cdda"
version = "0.3.0"
authors = [
    { name = "John Stephens" },
]
description = "Accurately extract CD audio track ranges with redumper"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ARver>=1.5,<2"]
keywords = ["accuraterip", "cdda", "cd-ripping", "redumper"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
]

[project.urls]
Homepage = "https://github.com/john-stephens/redumper-cdda"
Repository = "https://github.com/john-stephens/redumper-cdda"
Issues = "https://github.com/john-stephens/redumper-cdda/issues"

[project.optional-dependencies]
test = ["coverage[toml]>=7,<8"]

[project.scripts]
redumper-cdda = "redumper_cdda.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["src/redumper_cdda"]

[tool.coverage.report]
fail_under = 100
show_missing = true
